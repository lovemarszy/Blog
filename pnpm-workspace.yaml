packages:
  - '.'

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  cross-spawn: '>=7.0.6 <8.0.0'
  'minimatch@3': '>=3.1.5 <4.0.0'
  'minimatch@10': '>=10.2.6 <11.0.0'
  flatted: '>=3.4.4 <4.0.0'
  'picomatch@2': '>=2.3.2 <3.0.0'
  'picomatch@4': '>=4.0.7 <5.0.0'
  lodash-es: '>=4.18.1 <5.0.0'
  dompurify: '>=3.4.16 <4.0.0'
  'brace-expansion@1': '>=1.1.21 <2.0.0'
  'brace-expansion@5': '>=5.0.12 <6.0.0'
  yaml: '>=2.9.1 <3.0.0'
  # MathJax 间接依赖的安全版本下限。
  '@xmldom/xmldom': '>=0.9.12 <0.10.0'
  'next>postcss': '>=8.5.28 <9.0.0'
  source-map-js: '>=1.2.2 <2.0.0'
  # 这两项安全修复单独验收，避免混入框架升级。
  '@tailwindcss/typography>postcss-selector-parser': '>=7.1.6 <8.0.0'
  katex: '>=0.18.2 <0.19.0'
